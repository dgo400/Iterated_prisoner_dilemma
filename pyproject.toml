[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipd"
version = "0.1.0"
description = "Coevolution of strategies in the iterated prisoner's dilemma under action noise"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "deap>=1.4",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["game", "strategies", "experiments"]  # single files in src/
packages = ["analysis"]  # folders in src/
